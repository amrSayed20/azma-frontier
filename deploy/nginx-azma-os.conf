# AZMA OS — Production Configuration
#
# SECURITY CLOSURE (2026-09-16). Two changes, both measured before and after:
#
#   1. /uploads/ no longer serves files to the world. It is proxied to the
#      application, which verifies the session and the asset's owner and then
#      answers with X-Accel-Redirect into /protected-uploads/ — an `internal`
#      location nginx will only enter on its own instruction. Nginx still sends
#      the bytes; it just will not do so until ownership has been proven.
#
#      Measured before: GET /uploads/<uuid>.txt returned 200 with no session.
#
#   2. /_next/image is refused at the edge. Measured before: it returned 200
#      and 25,931 bytes of decoded image to an unauthenticated request, and it
#      fetched files out of /uploads/ to do it. Nothing in this Empire imports
#      next/image — zero matches across app/ and src/ — so the route was a
#      public decoder with no consumer. It is also disabled in next.config.ts;
#      closed here as well so one edit cannot reopen it.
server {
    listen 80;
    server_name azmaos.com www.azmaos.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name azmaos.com www.azmaos.com;

    ssl_certificate     /etc/ssl/cloudflare/azmaos.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/azmaos.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # Generated assets get the same gate as uploads. Measured during
    # verification: 23 vault_assets rows are addressed here, and this directory
    # was served to the world with no ownership check — one Creator's generated
    # images were readable by any other. Not the audited attack path (nobody
    # else chooses these bytes), but the same missing authorisation.
    location /generated-assets/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /protected-generated-assets/ {
        internal;
        alias /var/www/azma-uploads/generated-assets/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "private, max-age=0, no-store";
    }

    # PHASE E (2026-09-20). The finished films — the end of the whole Creator
    # journey — were the least protected thing in the Empire. The September 16
    # closure shut /uploads/ and /generated-assets/ and left this alias serving
    # the directory straight to the world, with "Cache-Control: public" telling
    # every proxy in between to keep its own copy.
    #
    #   Measured before, with no session and no cookie:
    #     GET /renders/op_render_1788000362601_0iusk3w8.mp4
    #     → 200 · 239,231 bytes · sha256 identical to the file on disk
    #     25 films · 7 Creators · all of them readable by anyone.
    #
    # Now proxied to the application, which proves ownership — or a live public
    # link the owner minted — and answers X-Accel-Redirect into the internal
    # location below. Nginx still sends the bytes and still serves ranges; it
    # just will not do so until it has been told who may have them.
    location /renders/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # NOT /root/azma-os/public/renders/. Measured: with the films under public/,
    # Next.js's own static handler served them BEFORE the route ever ran —
    #   GET /renders/op_shadowtest_probe.mp4 → 200 · 33 bytes · raw file
    # so proxying here would have changed who sent the bytes and nothing else.
    # The films were moved to UPLOADS_DIR, where public/ cannot shadow them.
    location /protected-renders/ {
        internal;
        alias /var/www/azma-uploads/renders/;
        add_header Accept-Ranges bytes;
        # Never "public". A shared cache holding a film would serve it from the
        # edge without ever reaching the gate, and would keep serving it after
        # its owner revoked the link — Article 9.3 requires access to stop.
        add_header Cache-Control "private, max-age=0, no-store";
    }

    # The authorisation gate. Every /uploads/ request reaches the application,
    # which decides whether this session owns the asset.
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The bytes themselves. `internal` means no client can request this path —
    # it is reachable only through an X-Accel-Redirect the application issues
    # after it has verified the session and the owner.
    location /protected-uploads/ {
        internal;
        alias /var/www/azma-uploads/;
        add_header Accept-Ranges bytes;
        # A Creator's own asset. Never a shared cache.
        add_header Cache-Control "private, max-age=0, no-store";
    }

    # The image optimizer is out of service. See the note at the head of this
    # file: an unauthenticated decoder with no consumer is an attack surface
    # and nothing else.
    location /_next/image {
        return 404;
    }

    # Next.js static assets — content-hash filenames; immutable at edge and browser.
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # All pages and API — Next.js sets Cache-Control + CDN-Cache-Control: no-store
    # via next.config.ts headers(); Nginx passes them through without adding duplicates.
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
